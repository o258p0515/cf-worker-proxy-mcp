name: GitHub MCP Proxy CI
on:
  push:
    branches: [main, feature/issue-68-azure-devops-runner]
    paths-ignore: ['deployment-status.json']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate Vietnam-time build version
        run: node scripts/generate-version.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Live Azure DevOps E2E on isolated preview
        if: (github.event_name == 'pull_request' && github.head_ref == 'feature/issue-68-azure-devops-runner') || (github.event_name == 'push' && github.ref_name == 'feature/issue-68-azure-devops-runner')
        timeout-minutes: 25
        env:
          PREVIEW_DOMAIN: https://github-mcp-proxy-issue68-preview.localmcpcoder-5b1b15.workers.dev
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
        run: node scripts/azure-preview-e2e.mjs
      - name: Validate deployment scripts syntax
        run: |
          node --check scripts/generate-version.mjs
          node --check scripts/prepare-deploy.mjs
          node --check scripts/sync-secrets.mjs
          node --check scripts/validate-env.mjs
          node --check scripts/azure-preview-e2e.mjs
   41