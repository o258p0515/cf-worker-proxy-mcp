name: Verify Agent Secret Readback
on:
  workflow_run:
    workflows: ["Agent Secret Write Test"]
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      MCP_SECRET_WRITE_TEST: ${{ secrets.MCP_SECRET_WRITE_TEST }}
      EXPECTED_TEST_VALUE: agent-secret-write-check-20261122
    steps:
      - name: Compare injected secret with expected test value without printing it
        run: |
          set -euo pipefail
          test -n "$MCP_SECRET_WRITE_TEST"
          if [ "$MCP_SECRET_WRITE_TEST" = "$EXPECTED_TEST_VALUE" ]; then
            echo "PASS: GitHub injected the exact value written by the production MCP tool."
          else
            echo "FAIL: GitHub secret value did not match the expected test value."
            exit 1
          fi
