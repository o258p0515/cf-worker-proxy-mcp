name: LocalMCP Hub Proxy E2E
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: localmcp-hub-proxy-e2e
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MCP_DOMAIN: ${{ secrets.MCP_DOMAIN }}
      MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Proxy and Hub credentials
        run: |
          set -euo pipefail
          test -n "$MCP_DOMAIN"
          test -n "$MCP_TOKEN"
          node --check scripts/localmcp-hub-e2e.mjs
      - name: Start, route and stop two runners through the production MCP Proxy
        run: node scripts/localmcp-hub-e2e.mjs
   29