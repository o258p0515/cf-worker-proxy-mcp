name: LocalMCP Hub Proxy E2E
on:
  push:
    branches: [feature/issue-68-azure-devops-runner]
    paths: ['.github/workflows/localmcp-hub-e2e.yml', 'scripts/azure-preview-e2e.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: localmcp-hub-proxy-e2e
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_DOMAIN: https://github-mcp-proxy-issue68-preview.localmcpcoder-5b1b15.workers.dev
      MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Proxy and Hub credentials
        run: |
          set -euo pipefail
          test -n "$PREVIEW_DOMAIN"
          test -n "$MCP_TOKEN"
          node --check scripts/azure-preview-e2e.mjs
      - name: Provision, verify and clean up Azure Linux and Windows runners through the isolated preview
        run: node scripts/azure-preview-e2e.mjs
   32