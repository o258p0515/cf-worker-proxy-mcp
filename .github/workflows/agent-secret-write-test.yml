name: Agent Secret Write Test
on:
  workflow_dispatch:
    inputs:
      account_alias:
        description: GitHub MCP account alias to use
        required: true
        default: personal
permissions:
  contents: read
jobs:
  set-test-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Set test secret through production MCP tool
        env:
          MCP_DOMAIN: ${{ secrets.MCP_DOMAIN }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          ACCOUNT_ALIAS: ${{ inputs.account_alias }}
          EXPECTED_TEST_VALUE: agent-secret-write-check-20261122
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = `https://${process.env.MCP_DOMAIN}/mcp`;
          let id = 1;
          async function call(name, args) {
            const response = await fetch(base, { method: "POST", headers: { "Content-Type": "application/json", "X-API-Key": process.env.MCP_TOKEN }, body: JSON.stringify({ jsonrpc: "2.0", id: id++, method: "tools/call", params: { name, arguments: args } }) });
            const payload = await response.json();
            if (!response.ok || payload.error || payload.result?.isError) throw new Error(payload.error?.message || payload.result?.content?.[0]?.text || `MCP HTTP ${response.status}`);
            return payload.result;
          }
          const accounts = await call("list_github_accounts", {});
          const available = JSON.parse(accounts.content?.[0]?.text || "[]");
          if (!available.some(x => x.alias === process.env.ACCOUNT_ALIAS && !x.readonly)) throw new Error("Selected account alias is unavailable or read-only.");
          await call("select_github_account", { alias: process.env.ACCOUNT_ALIAS });
          await call("set_github_secret", { owner: "o258p0515", repo: "cf-worker-proxy-mcp", secret_name: "MCP_SECRET_WRITE_TEST", value: process.env.EXPECTED_TEST_VALUE });
          console.log("PASS: production MCP set_github_secret accepted the test secret; value was not printed.");
          NODE
