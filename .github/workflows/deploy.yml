name: Deploy GitHub MCP Proxy
on:
  push:
    branches: [main]
    paths-ignore: ['deployment-status.json', '.github/localmcp-smoke.trigger']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-mcp-proxy-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MCP_DOMAIN: ${{ secrets.MCP_DOMAIN }}
      MCP_API_PASSPHRASE: ${{ secrets.MCP_API_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate Vietnam-time build version
        run: node scripts/generate-version.mjs
      - name: Pre-flight validate environment
        env:
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          MCP_API_PASSPHRASE: ${{ secrets.MCP_API_PASSPHRASE }}
          MCP_OAUTH_CLIENT_ID: ${{ secrets.MCP_OAUTH_CLIENT_ID }}
          MCP_OAUTH_CLIENT_SECRET: ${{ secrets.MCP_OAUTH_CLIENT_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RTDB_URL: ${{ secrets.RTDB_URL }}
          RTDB_AUTH_URL: ${{ secrets.RTDB_AUTH_URL }}
        run: node scripts/validate-env.mjs
      - name: Install dependencies, typecheck and test
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Prepare Cloudflare infrastructure
        env:
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        run: node scripts/prepare-deploy.mjs
      - name: Enforce configured MCP hostname
        run: test "$WORKER_DOMAIN" = "$MCP_DOMAIN" && test "$PUBLIC_DOMAIN" = "$MCP_DOMAIN"
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.deploy.jsonc
      - name: Sync runtime secrets
        env:
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          MCP_API_PASSPHRASE: ${{ secrets.MCP_API_PASSPHRASE }}
          MCP_OAUTH_CLIENT_ID: ${{ secrets.MCP_OAUTH_CLIENT_ID }}
          MCP_OAUTH_CLIENT_SECRET: ${{ secrets.MCP_OAUTH_CLIENT_SECRET }}
          RTDB_URL: ${{ secrets.RTDB_URL }}
          RTDB_AUTH_URL: ${{ secrets.RTDB_AUTH_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-secrets.mjs | npx wrangler secret bulk --config wrangler.deploy.jsonc
      - name: Smoke test Worker endpoints and version
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error "https://$WORKER_DOMAIN/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --silent --show-error "https://$PUBLIC_DOMAIN/version" | tee /tmp/version.json
          grep -Eq '"version":"v\.[0-9]{2}\.[0-9]{4}\.[0-9]{4}"' /tmp/version.json
          curl --fail --silent --show-error "https://$PUBLIC_DOMAIN/api" > /tmp/api.html && grep -q 'GitHub MCP' /tmp/api.html
          API_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$PUBLIC_DOMAIN/api/rpc" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          test "$API_STATUS" = "401"
      - name: Smoke test OAuth metadata and MCP authentication
        env:
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
        run: |
          set -euo pipefail
          META=$(curl --fail --silent --show-error "https://$WORKER_DOMAIN/.well-known/oauth-authorization-server")
          echo "$META" | grep -q '"registration_endpoint"'
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$WORKER_DOMAIN/mcp" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          test "$STATUS" = "401"
          INIT=$(curl --fail --silent --show-error -X POST "https://$PUBLIC_DOMAIN/mcp" -H "X-API-Key: $MCP_TOKEN" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":22,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"production-parity-smoke","version":"1"}}}')
          echo "$INIT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.error||!r.result?.protocolVersion||!r.result?.serverInfo?.name||r.result.serverInfo.name==="github-mcp-proxy")process.exit(1)})'
          TOOLS=$(curl --fail --silent --show-error -X POST "https://$PUBLIC_DOMAIN/mcp" -H "X-API-Key: $MCP_TOKEN" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":23,"method":"tools/list","params":{}}')
          echo "$TOOLS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);const t=r.result?.tools||[];const names=t.map(x=>x.name);const required=["list_github_accounts","select_github_account","list_github_secrets","set_github_secret","delete_github_secret","localmcp_configure_secrets","localmcp_check_secrets","localmcp_reset_secrets","localmcp_check_workflow","localmcp_start","localmcp_stop","localmcp_restart","localmcp_status","localmcp_runs","localmcp_logs","localmcp_connection_check","localmcp_hub_check_connection","localmcp_hub_tools","localmcp_hub_call","localmcp_hub_check_secrets","localmcp_hub_start","localmcp_hub_stop","localmcp_hub_status","localmcp_hub_runs"];if(r.error||!t.length||required.some(n=>!names.includes(n))||t.some(x=>x.inputSchema?.properties?.account))process.exit(1);if(!names.includes("get_me"))process.exit(1);console.log("Production MCP smoke passed: "+t.length+" tools including account controls, Actions secrets, and LocalMCP lifecycle tools")})'
          SELECT=$(curl --fail --silent --show-error -X POST "https://$PUBLIC_DOMAIN/mcp" -H "X-API-Key: $MCP_TOKEN" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":24,"method":"tools/call","params":{"name":"select_github_account","arguments":{"alias":"personal"}}}')
          echo "$SELECT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.error||r.result?.isError)process.exit(1);const v=JSON.parse(r.result?.content?.[0]?.text||"{}");if(v.selected!=="personal")process.exit(1);console.log("Production account selection smoke passed")})'
          WORKFLOW=$(curl --fail --silent --show-error -X POST "https://$PUBLIC_DOMAIN/mcp" -H "X-API-Key: $MCP_TOKEN" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":25,"method":"tools/call","params":{"name":"localmcp_check_workflow","arguments":{}}}')
          echo "$WORKFLOW" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.error||r.result?.isError)process.exit(1);const v=JSON.parse(r.result?.content?.[0]?.text||"{}");if(v.state!=="active"||v.path!==".github/workflows/example-run.yml")process.exit(1);console.log("Production LocalMCP workflow check passed")})'
          SECRETS=$(curl --fail --silent --show-error -X POST "https://$PUBLIC_DOMAIN/mcp" -H "X-API-Key: $MCP_TOKEN" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":26,"method":"tools/call","params":{"name":"localmcp_check_secrets","arguments":{}}}')
          echo "$SECRETS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.error||r.result?.isError){console.error("LocalMCP secret check RPC error: "+JSON.stringify(r.error||r.result));process.exit(1)}const v=JSON.parse(r.result?.content?.[0]?.text||"{}");const missing=v.required_missing_on_github||[];console.log("LocalMCP secret metadata (values hidden): "+JSON.stringify({repository:v.repository,configured_names:v.configured_names,required_missing_from_rtdb:v.required_missing_from_rtdb,required_missing_on_github:missing}));if(missing.length){console.error("Required GitHub repository secrets missing: "+missing.join(", "));process.exit(1)}console.log("Production LocalMCP GitHub secret-name check passed; all required secrets exist and no values were returned")})'
      - name: Record deployment result
        if: always()
        env:
          DEPLOYED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          BUILD_VERSION: ${{ env.MCP_VERSION }}
        run: |
          set -euo pipefail
          ENDPOINT="https://$MCP_DOMAIN/mcp"
          cat > deployment-status.json <<EOF_STATUS
          { "status": "$JOB_STATUS", "workflow_run_id": "$RUN_ID", "deployed_commit": "$DEPLOYED_SHA", "version": "$BUILD_VERSION", "endpoint": "$ENDPOINT" }
          EOF_STATUS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A code commit may land while deployment is running. Rebase only this
          # generated status file onto the newest main instead of failing the deploy.
          cp deployment-status.json "$RUNNER_TEMP/deployment-status.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/deployment-status.json" deployment-status.json
          git add -f deployment-status.json
          git commit -m "chore(deploy): record deployment result [skip ci]" || echo 'No deployment status changes to commit'
          git push origin HEAD:refs/heads/main